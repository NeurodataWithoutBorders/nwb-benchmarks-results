name: Bundle JSON Files

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Merges every JSON file in the data directories into one minified object keyed by relative
      # path, gzips it, and force-pushes it alone to the orphan `min` branch. Files outside these
      # directories are not benchmark data and are left out. Nothing is pushed if it is unchanged.
      - name: Bundle the benchmark data onto the 'min' branch
        uses: CodyCBakerPhD/dist-bundle-action@v1
        with:
          paths: |
            environments
            machines
            results
          format: json.gz
          filename: bundle.json.gz
          branch: min
